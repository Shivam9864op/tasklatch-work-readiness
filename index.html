<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#19172d">

    <title>TaskLatch — Is the task actually assigned?</title>
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./theme-refinement.css">
    <script type="module" src="./src/app.mjs"></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Main navigation">
        <a class="brand" href="#overview" aria-label="TaskLatch home"><span class="brand-mark">TL</span><span><strong>TaskLatch</strong><small>work-readiness desk</small></span></a>
        <div class="sidebar-label">WORKSPACE</div>
        <nav class="nav-list">
          <button class="nav-item is-active" data-view="overview"><span class="nav-icon">01</span> Overview</button>
          <button class="nav-item" data-view="opportunities"><span class="nav-icon">02</span> Opportunities <span class="nav-count" id="nav-count">5</span></button>
          <button class="nav-item" data-view="offer-check"><span class="nav-icon">03</span> Offer check</button>
